# Base config for TestGeneratedConfig. It sets every key `piri serve` reads from
# a config file, plus every key `piri init --base-config` parses, each to a value
# that differs from what init writes from an empty base config. Init ignores many
# of them today; if it starts honouring one, the golden file changes.
# TestGeneratedConfigFixtureIsComplete checks all of that.
#
# Every secret below is a fake.

config_version = 99
network = "fixture"

[identity]
key_file = "/base/identity.pem"

[server]
port = 4100
host = "base.example.com"
public_url = "https://base-public.example.com"

[repo]
data_dir = "/base/data"
temp_dir = "/base/temp"

[repo.database]
type = "postgres"

[repo.database.postgres]
url = "postgres://piri:fixture-db-password@db.example.com:5432/piri?sslmode=disable"
max_open_conns = 17
max_idle_conns = 13
conn_max_lifetime = "45m"

[repo.s3]
endpoint = "s3.example.com:9000"
bucket_prefix = "fixture-"
insecure = true

[repo.s3.credentials]
access_key_id = "fixture-access-key"
secret_access_key = "fixture-secret-key"

[pdp]
owner_address = "0x0123456789012345678901234567890123456789"
lotus_endpoint = "wss://base-lotus.example.com/rpc/v1"
lotus_auth_token = "fixture-base-lotus-token"
chain_id = "314159"
payer_address = "0x7890123456789012345678901234567890123456"

[pdp.signing_service]
did = "did:web:signer.example.com"
url = "https://signer.example.com"
private_key = "fixture-not-a-key"

[pdp.contracts]
verifier = "0x1234567890123456789012345678901234567890"
provider_registry = "0x2345678901234567890123456789012345678901"
service = "0x3456789012345678901234567890123456789012"
service_view = "0x4567890123456789012345678901234567891234"
payments = "0x5678901234567890123456789012345678901234"
usdfc_token = "0x6789012345678901234567890123456789012345"

[pdp.piece]
max_padded_size = 2048

[pdp.aggregation.commp.job_queue]
workers = 97
retries = 11
retry_delay = "7s"

[pdp.aggregation.aggregator]
min_aggregate_size = 4096

[pdp.aggregation.aggregator.job_queue]
workers = 98
retries = 12
retry_delay = "8s"

[pdp.aggregation.manager]
poll_interval = "41s"
batch_size = 23

[pdp.aggregation.manager.job_queue]
workers = 99
retries = 13
retry_delay = "9s"

[pdp.gas]
retry_wait = "17s"

[pdp.gas.max_fee]
prove = 101
proving_period = 102
proving_init = 103
add_roots = 104
default = 105

[ucan]
proof_set = 77
insecure_did_resolution = true
plc_directory = "https://base-plc.example.com"

[ucan.services.indexer]
did = "did:web:indexer.example.com"
url = "https://indexer.example.com"
proof = "fixture-base-indexer-proof"

[ucan.services.etracker]
did = "did:web:etracker.example.com"
url = "https://etracker.example.com"
receipts_endpoint = "https://etracker-receipts.example.com/base"
max_batch_size_bytes = 20971520
proof = "fixture-base-egress-proof"

[ucan.services.upload]
did = "did:web:upload.example.com"
url = "https://upload.example.com"

[ucan.services.publisher]
ipni_announce_urls = ["https://ipni.example.com"]

[ucan.services.principal_mapping]
"did:web:upload.example.com" = "did:web:upload-alias.example.com"

[telemetry]
environment = "fixture"

[[telemetry.metrics]]
endpoint = "collector.example.com:4318"
insecure = true
publish_interval = "30s"

[telemetry.metrics.headers]
authorization = "fixture-metrics-header"

[[telemetry.traces]]
endpoint = "collector.example.com:4318"
insecure = true
publish_interval = "15s"

[telemetry.traces.headers]
authorization = "fixture-traces-header"
