name: Go Test

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    uses: ipdxco/unified-github-workflows/.github/workflows/go-test.yml@d9b156f4be9fae6843707f5e5cda2fb079f821ac # v1.0
    with:
      go-versions: '["this"]'
      # Curio's dep tree includes FFI cgo packages unless built with the
      # skiff tag (see Makefile). Tests run with cgo enabled (set in
      # go-test-config.json): gosigar, an indirect dependency via lotus
      # and curio, only builds with cgo on macOS, and the workflow does
      # not support per-OS cgo settings. The CGO-free Linux build is
      # covered by the Container workflow (Dockerfile).
      env: |
        GOFLAGS=-tags=skiff
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}