name: Go Test

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    uses: ipdxco/unified-github-workflows/.github/workflows/go-test.yml@1822b44541e3ad073b8f9109e346ba0ddd4ce96e # v1.0
    with:
      go-versions: '["this"]'
      # Curio's dep tree includes FFI cgo packages unless built with the
      # skiff tag (see Makefile); cgo is disabled via go-test-config.json.
      env: |
        GOFLAGS=-tags=skiff
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}