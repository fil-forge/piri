name: Binaries Releaser
on:
  release:
    types: [ published ]
  workflow_dispatch:
  workflow_run:
    workflows: [Releaser]
    types: [completed]

permissions:
  contents: write

jobs:
  bin-releaser:
    name: Release Binaries
    # The darwin builds need cgo (see .goreleaser.yaml), so they must be
    # built on a mac; the cgo-free linux builds cross-compile fine from here.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Release Binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
