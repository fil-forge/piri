name: Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_run:
    workflows: [Releaser]
    types:
      - completed
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # PR Build Check - validate Dockerfile compiles, single platform, no push
  build-check:
    if: github.event_name == 'pull_request'
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (amd64 only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  # Prepare ref for Releaser workflow integration
  prepare-checkout:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    name: Prepare ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.releaser.outputs.version }}
    steps:
      - name: Get ref from Releaser
        id: releaser
        uses: ipdxco/unified-github-workflows/.github/actions/inspect-releaser@1822b44541e3ad073b8f9109e346ba0ddd4ce96e # v1.0
        with:
          artifacts-url: ${{ github.event.workflow_run.artifacts_url }}

  # Publish on push to main branch
  publish-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish (main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Resolving the pull request this commit merged from, for the link the
      # bump pull request carries.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The dev node pins :main by digest, so a merge here is a deploy there.
      # Only this job dispatches: publish-release builds tags nothing runs yet.
      - name: Resolve the source pull request
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.merged_at != null)) | .[0].html_url // ""')
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # Scoped down at mint time: this token can reach infra-nodes and nothing
      # else in the organisation.
      - name: Mint fil-forge-bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FORGE_BOT_APP_ID }}
          private-key: ${{ secrets.FORGE_BOT_PRIVATE_KEY }}
          owner: fil-forge
          repositories: infra-nodes

      # infra-nodes rewrites its pin and opens a pull request with auto-merge
      # armed. Merging queues the image; the node deploys it on its next
      # reconcile pass.
      - name: Request a digest bump on the dev node
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PR_URL: ${{ steps.source.outputs.pr_url }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::unexpected digest: '$DIGEST'"; exit 1; }
          jq -n \
            --arg service piri \
            --arg digest "$DIGEST" \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg pr_url "$PR_URL" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{event_type: "bump-deployed-image",
              client_payload: {service: $service, digest: $digest,
                               source_repo: $source_repo, commit: $commit,
                               pr_url: $pr_url, run_url: $run_url}}' \
            | gh api --method POST repos/fil-forge/infra-nodes/dispatches --input -

  # Publish on release tag (v*) - direct push or via Releaser
  publish-release:
    name: Publish (release)
    needs: [prepare-checkout]
    # Run if: direct tag push OR workflow_run completed successfully
    # always() allows running even when prepare-checkout was skipped (direct tag push)
    if: |
      always() && !cancelled() && !failure() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ needs.prepare-checkout.outputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.ref }},match=v([0-9].*)

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max